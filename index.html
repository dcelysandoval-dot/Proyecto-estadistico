<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador Automático de Apuestas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-20 shadow-lg">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">⚽ StatsValue Auto Pro</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">Alineaciones 11 vs 11</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Selector de Partido y API Key -->
    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-300">Seleccionar Partido del Día:</label>
        <span class="text-[10px] text-slate-400">Auto-Fetch API</span>
      </div>

      <select id="matchSelect" onchange="loadSelectedMatch()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        <option value="liv_rm">Liverpool vs Real Madrid (Alineaciones Confirmadas)</option>
        <option value="mci_ars">Manchester City vs Arsenal (Próximamente)</option>
        <option value="bar_rma">FC Barcelona vs Real Madrid (Próximamente)</option>
      </select>

      <div class="pt-2 border-t border-slate-700 flex gap-2">
        <input id="apiKey" type="password" placeholder="Tu API-Football Key (Opcional)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
        <button onclick="fetchLiveMatchData()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-2 rounded-lg text-xs font-bold transition-all">
          Sincronizar API
        </button>
      </div>
    </section>

    <!-- TOP OPORTUNIDADES DEL PARTIDO -->
    <section class="space-y-3">
      <h2 class="text-base font-bold text-emerald-400 flex items-center gap-2">
        <span>🔥</span> TOP Oportunidades del Partido (>60% Prob)
      </h2>
      <div id="topPicks" class="space-y-2">
        <!-- JS Insertará los mejores picks -->
      </div>
    </section>

    <!-- ANÁLISIS COMPLETO JUGADOR POR JUGADOR -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>👥</span> Análisis Completo de Plantillas
        </h2>
        <div class="flex gap-1 text-xs">
          <button onclick="filterTeam('ALL')" class="px-2 py-1 bg-slate-700 rounded font-medium text-slate-300">Todos</button>
          <button onclick="filterTeam('HOME')" class="px-2 py-1 bg-slate-800 rounded font-medium text-slate-400">Local</button>
          <button onclick="filterTeam('AWAY')" class="px-2 py-1 bg-slate-800 rounded font-medium text-slate-400">Visitante</button>
        </div>
      </div>

      <div id="playersList" class="space-y-3">
        <!-- JS Insertará la matriz de los 22 jugadores -->
      </div>
    </section>

  </main>

  <script>
    // Base de datos de ejemplo (Simulación de respuesta API)
    const matchData = {
      teams: { home: "Liverpool", away: "Real Madrid" },
      players: [
        // Liverpool
        { name: "Mohamed Salah", team: "HOME", pos: "DEL", sot90: 1.6, shots90: 3.4, xG90: 0.58, xA90: 0.32, fouls90: 0.8, cards90: 0.10, oddsSOT15: 1.75 },
        { name: "Darwin Núñez", team: "HOME", pos: "DEL", sot90: 1.8, shots90: 4.1, xG90: 0.62, xA90: 0.20, fouls90: 1.4, cards90: 0.25, oddsSOT15: 1.65 },
        { name: "Luis Díaz", team: "HOME", pos: "EXT", sot90: 1.1, shots90: 2.7, xG90: 0.35, xA90: 0.22, fouls90: 1.1, cards90: 0.12, oddsSOT15: 2.10 },
        { name: "Alexis Mac Allister", team: "HOME", pos: "MED", sot90: 0.6, shots90: 1.5, xG90: 0.18, xA90: 0.15, fouls90: 1.8, cards90: 0.30, oddsSOT15: 3.20 },
        { name: "Virgil van Dijk", team: "HOME", pos: "DEF", sot90: 0.4, shots90: 0.9, xG90: 0.10, xA90: 0.03, fouls90: 0.7, cards90: 0.11, oddsSOT15: 4.50 },
        
        // Real Madrid
        { name: "Kylian Mbappé", team: "AWAY", pos: "DEL", sot90: 2.1, shots90: 4.5, xG90: 0.75, xA90: 0.25, fouls90: 0.6, cards90: 0.08, oddsSOT15: 1.50 },
        { name: "Vinícius Júnior", team: "AWAY", pos: "EXT", sot90: 1.4, shots90: 3.2, xG90: 0.48, xA90: 0.30, fouls90: 1.5, cards90: 0.35, oddsSOT15: 1.85 },
        { name: "Jude Bellingham", team: "AWAY", pos: "MED", sot90: 1.0, shots90: 2.4, xG90: 0.40, xA90: 0.28, fouls90: 1.6, cards90: 0.28, oddsSOT15: 2.25 },
        { name: "Federico Valverde", team: "AWAY", pos: "MED", sot90: 0.7, shots90: 1.8, xG90: 0.15, xA90: 0.18, fouls90: 0.9, cards90: 0.12, oddsSOT15: 2.90 },
        { name: "Antonio Rüdiger", team: "AWAY", pos: "DEF", sot90: 0.3, shots90: 0.8, xG90: 0.08, xA90: 0.02, fouls90: 1.3, cards90: 0.22, oddsSOT15: 5.00 }
      ]
    };

    // Funciones Matemáticas
    function poisson(k, lambda) {
      return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }
    function factorial(n) {
      return (n <= 1) ? 1 : n * factorial(n - 1);
    }
    function probAtLeast(k, lambda) {
      let sum = 0;
      for (let i = 0; i < k; i++) sum += poisson(i, lambda);
      return 1 - sum;
    }

    let currentFilter = 'ALL';

    function loadSelectedMatch() {
      renderApp();
    }

    function filterTeam(filter) {
      currentFilter = filter;
      renderApp();
    }

    function renderApp() {
      const playersListDiv = document.getElementById('playersList');
      const topPicksDiv = document.getElementById('topPicks');
      
      playersListDiv.innerHTML = '';
      topPicksDiv.innerHTML = '';

      let calculatedPlayers = matchData.players.map(p => {
        // Asumimos 85 min proyectados
        const factor = 85 / 90;
        
        const probSOT05 = probAtLeast(1, p.sot90 * factor);
        const probSOT15 = probAtLeast(2, p.sot90 * factor);
        const probGoal = probAtLeast(1, p.xG90 * factor);
        const probAst = probAtLeast(1, p.xA90 * factor);
        const probFouls15 = probAtLeast(2, p.fouls90 * factor);
        const probCard = probAtLeast(1, p.cards90 * factor);

        const evSOT15 = (probSOT15 * p.oddsSOT15) - 1;

        return {
          ...p,
          probSOT05,
          probSOT15,
          probGoal,
          probAst,
          probFouls15,
          probCard,
          evSOT15
        };
      });

      // Render Top Picks (>60% Probabilidad en Remates a Puerta +1.5 o EV+)
      const topPicks = calculatedPlayers
        .filter(p => p.probSOT15 >= 0.50 || p.evSOT15 > 0.05)
        .sort((a, b) => b.probSOT15 - a.probSOT15);

      topPicks.forEach(p => {
        topPicksDiv.innerHTML += `
          <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-lg p-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-white">${p.name}</span>
                <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${p.team === 'HOME' ? matchData.teams.home : matchData.teams.away}</span>
              </div>
              <p class="text-xs text-emerald-400 mt-0.5">Mercado: +1.5 Remates a Puerta</p>
            </div>
            <div class="text-right">
              <span class="text-base font-bold text-emerald-400">${(p.probSOT15 * 100).toFixed(1)}%</span>
              <p class="text-[10px] text-slate-400">Cuota: ${p.oddsSOT15.toFixed(2)} | EV: ${(p.evSOT15 * 100).toFixed(1)}%</p>
            </div>
          </div>
        `;
      });

      // Filtrar lista completa
      const filteredPlayers = calculatedPlayers.filter(p => {
        if (currentFilter === 'ALL') return true;
        return p.team === currentFilter;
      });

      // Render Lista Completa de Jugadores
      filteredPlayers.forEach(p => {
        playersListDiv.innerHTML += `
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
            <div class="flex justify-between items-start border-b border-slate-700 pb-2">
              <div>
                <h3 class="font-bold text-sm text-white">${p.name} <span class="text-xs text-slate-400 font-normal">(${p.pos})</span></h3>
                <p class="text-[10px] text-slate-400">${p.team === 'HOME' ? matchData.teams.home : matchData.teams.away}</p>
              </div>
              <span class="text-xs font-bold px-2 py-1 rounded ${p.evSOT15 > 0 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-slate-700 text-slate-400'}">
                EV: ${(p.evSOT15 * 100).toFixed(1)}%
              </span>
            </div>

            <!-- Matriz de Probabilidades -->
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+0.5)</p>
                <p class="font-bold text-slate-200">${(p.probSOT05 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+1.5)</p>
                <p class="font-bold text-emerald-400">${(p.probSOT15 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Anota Gol (xG)</p>
                <p class="font-bold text-slate-200">${(p.probGoal * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Asistencia (xA)</p>
                <p class="font-bold text-slate-200">${(p.probAst * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Faltas (+1.5)</p>
                <p class="font-bold text-slate-200">${(p.probFouls15 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Tarjeta Amarilla</p>
                <p class="font-bold text-amber-400">${(p.probCard * 100).toFixed(1)}%</p>
              </div>
            </div>
          </div>
        `;
      });
    }

    function fetchLiveMatchData() {
      const key = document.getElementById('apiKey').value;
      if (!key) {
        alert("Introduce tu API Key de API-Football para actualizar datos en vivo.");
        return;
      }
      alert("Conectando con la API... (Suscripción activa requerida para fixtures live).");
    }

    // Inicializar
    renderApp();
  </script>
</body>
</html>
