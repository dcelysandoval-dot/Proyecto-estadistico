<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatsValue V2 — Pro Analytics & Combined Bets</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12">

  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-2xl backdrop-blur-md bg-opacity-90">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-emerald-400 tracking-wide">⚽ StatsValue V2 Pro</h1>
      <span class="text-[11px] bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full font-bold border border-emerald-500/30">
        Algoritmo +EV (60-80% Acierto)
      </span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- Selector de Partidos -->
    <section class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-lg">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-300">Partido en Lista:</label>
        <span id="matchStatus" class="text-[11px] text-emerald-400 font-bold">Cargando...</span>
      </div>

      <select id="matchSelect" onchange="analyzeSelectedFixture()" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
        <option value="">Cargando partidos de hoy...</option>
      </select>
    </section>

    <!-- Análisis Táctico y Necesidades del Partido -->
    <section id="tacticalSection" class="hidden bg-slate-900/80 border border-indigo-500/30 rounded-2xl p-4 space-y-2">
      <h2 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
        <span>📋</span> Análisis Táctico de Formaciones y Tendencia
      </h2>
      <p id="tacticalText" class="text-xs text-slate-300 leading-relaxed italic"></p>
    </section>

    <!-- Apuesta Combinada Destacada -->
    <section id="combinedSection" class="hidden bg-gradient-to-r from-emerald-950/60 to-slate-900 border border-emerald-500/50 rounded-2xl p-4 space-y-2 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-emerald-400 flex items-center gap-2">
          <span>🔥</span> Sugerencia Combinada (Same Game Parlay)
        </h2>
        <span id="combinedOddBadge" class="bg-emerald-500 text-slate-950 text-xs px-2.5 py-0.5 rounded-full font-black"></span>
      </div>
      <div id="combinedContent" class="text-xs space-y-1 text-slate-200"></div>
    </section>

    <!-- Lista de Jugadores + Análisis Individual -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <span>📊</span> Métricas, Proyecciones y Cuotas
        </h2>
        <div class="flex gap-1 text-[11px]">
          <button onclick="filterTeam('ALL')" class="px-2.5 py-1 bg-slate-800 rounded-lg text-slate-300 font-bold">Todos</button>
          <button onclick="filterTeam('HOME')" class="px-2.5 py-1 bg-slate-800 rounded-lg text-slate-400 font-bold">Local</button>
          <button onclick="filterTeam('AWAY')" class="px-2.5 py-1 bg-slate-800 rounded-lg text-slate-400 font-bold">Visitante</button>
        </div>
      </div>

      <div id="playersList" class="space-y-4"></div>
    </section>

  </main>

  <script>
    const BACKEND_URL = "https://stats-backend-jpd3.onrender.com";
    let currentPlayers = [];
    let currentFilter = 'ALL';

    document.addEventListener("DOMContentLoaded", fetchLiveMatches);

    async function fetchLiveMatches() {
      const statusEl = document.getElementById('matchStatus');
      try {
        const now = new Date();
        const today = now.toISOString().split('T')[0];

        const res = await fetch(`${BACKEND_URL}/matches?date=${today}`);
        const data = await res.json();

        if (data.error) {
          statusEl.textContent = "Error servidor";
          return;
        }

        const matches = data.response || [];
        const select = document.getElementById('matchSelect');
        select.innerHTML = '';

        if (matches.length === 0) {
          select.innerHTML = '<option value="">Sin partidos hoy</option>';
          statusEl.textContent = "Sin datos";
          return;
        }

        matches.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.fixture.id;
          opt.textContent = `[${item.league.name}] ${item.teams.home.name} vs ${item.teams.away.name}`;
          select.appendChild(opt);
        });

        statusEl.textContent = `${matches.length} partidos`;
        analyzeSelectedFixture();

      } catch (e) {
        statusEl.textContent = "Error de conexión";
      }
    }

    async function analyzeSelectedFixture() {
      const fixtureId = document.getElementById('matchSelect').value;
      if (!fixtureId) return;

      document.getElementById('matchStatus').textContent = "Analizando...";

      try {
        const response = await fetch(`${BACKEND_URL}/analyze-fixture?fixture=${fixtureId}`);
        const data = await response.json();

        currentPlayers = data.players || [];

        // Mostrar Análisis Táctico
        if (data.tacticalAnalysis) {
          document.getElementById('tacticalSection').classList.remove('hidden');
          document.getElementById('tacticalText').textContent = data.tacticalAnalysis;
        }

        // Mostrar Combinada
        if (data.combinedBet) {
          document.getElementById('combinedSection').classList.remove('hidden');
          document.getElementById('combinedOddBadge').textContent = `Cuota: ${data.combinedBet.combinedOdd}`;
          document.getElementById('combinedContent').innerHTML = `
            <p>• <b>Leg 1:</b> ${data.combinedBet.leg1}</p>
            <p>• <b>Leg 2:</b> ${data.combinedBet.leg2}</p>
            <p class="text-[10px] text-amber-400 mt-1"><b>Gestión de Riesgo:</b> Usar ${data.combinedBet.recommendedStake}</p>
          `;
        }

        document.getElementById('matchStatus').textContent = "Listo";
        renderDashboard();

      } catch (e) {
        document.getElementById('matchStatus').textContent = "Error";
      }
    }

    function filterTeam(f) {
      currentFilter = f;
      renderDashboard();
    }

    function renderDashboard() {
      const listDiv = document.getElementById('playersList');
      listDiv.innerHTML = '';

      const filtered = currentPlayers.filter(p => currentFilter === 'ALL' ? true : p.team === currentFilter);

      if (filtered.length === 0) {
        listDiv.innerHTML = '<p class="text-xs text-slate-500 italic">No hay alineaciones confirmadas para este equipo.</p>';
        return;
      }

      filtered.forEach(p => {
        listDiv.innerHTML += `
          <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-lg">
            <div class="flex justify-between items-start border-b border-slate-800 pb-2">
              <div>
                <h3 class="font-bold text-sm text-white">${p.name} <span class="text-xs text-slate-400">(${p.pos})</span></h3>
                <p class="text-[10px] text-emerald-400 font-semibold">${p.teamName}</p>
              </div>
              <div class="text-right">
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded font-bold border border-emerald-500/20">
                  +EV ${p.maxEV.toFixed(1)}%
                </span>
              </div>
            </div>

            <!-- Análisis Escrito del Jugador -->
            <p class="text-[11px] text-slate-300 leading-snug bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
              💡 <b>Análisis de Selección:</b> ${p.writtenAnalysis}
            </p>

            <!-- Grilla de Métricas Ampliadas -->
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-400">Prom. Disparos</p>
                <p class="font-bold text-slate-200">${p.avgShots}</p>
              </div>
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+0.5)</p>
                <p class="font-bold text-emerald-400">${(p.probSOT05 * 100).toFixed(0)}%</p>
              </div>
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-400">Marca / Asiste</p>
                <p class="font-bold text-indigo-400">${(p.probGoalOrAst * 100).toFixed(0)}%</p>
              </div>
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-400">Prom. Faltas</p>
                <p class="font-bold text-slate-200">${p.avgFouls}</p>
              </div>
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-400">Faltas (+1.5)</p>
                <p class="font-bold text-amber-400">${(p.probFouls15 * 100).toFixed(0)}%</p>
              </div>
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-400">Recibe Tarjeta</p>
                <p class="font-bold text-rose-400">${(p.probCard * 100).toFixed(0)}%</p>
              </div>
            </div>

            <!-- Comparativa de Cuotas -->
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
              <div>
                <span class="text-[9px] text-slate-400 block">Mercado Seleccionado:</span>
                <span class="font-bold text-amber-400">${p.suggestedMarket}</span>
              </div>
              <div class="flex gap-2">
                <div class="px-2.5 py-1 bg-slate-900 rounded-lg border border-blue-500/30 text-center">
                  <p class="text-[9px] text-blue-400 font-bold">Betplay</p>
                  <p class="font-bold text-white text-xs">${p.betplayOdd}</p>
                </div>
                <div class="px-2.5 py-1 bg-slate-900 rounded-lg border border-orange-500/30 text-center">
                  <p class="text-[9px] text-orange-400 font-bold">Rushbet</p>
                  <p class="font-bold text-white text-xs">${p.rushbetOdd}</p>
                </div>
              </div>
            </div>

          </div>
        `;
      });
    }
  </script>
</body>
</html>
