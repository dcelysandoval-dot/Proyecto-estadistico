<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatsValue Auto Pro Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-20 shadow-lg">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">⚽ StatsValue Auto Pro</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">Ligas Top + LATAM</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-300">Seleccionar Partido Prioritario:</label>
        <span id="matchStatus" class="text-[10px] text-emerald-400 font-semibold">Listo</span>
      </div>

      <select id="matchSelect" onchange="analyzeSelectedFixture()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
        <option value="">Sincroniza la API para cargar partidos...</option>
      </select>

      <div class="pt-2 border-t border-slate-700 flex gap-2">
        <input id="apiKey" type="password" placeholder="Pega tu API Key de API-Sports aquí" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
        <button onclick="fetchLiveMatches()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-2 rounded-lg text-xs font-bold transition-all">
          Sincronizar API
        </button>
      </div>
    </section>

    <section class="space-y-3">
      <h2 class="text-base font-bold text-emerald-400 flex items-center gap-2">
        <span>🔥</span> TOP Oportunidades del Partido (>60% Prob)
      </h2>
      <div id="topPicks" class="space-y-2">
        <p class="text-xs text-slate-500 italic">Sincroniza para analizar el partido seleccionado...</p>
      </div>
    </section>

    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>👥</span> Análisis Completo de Plantillas
        </h2>
        <div class="flex gap-1 text-xs">
          <button onclick="filterTeam('ALL')" class="px-2 py-1 bg-slate-700 rounded font-medium text-slate-300">Todos</button>
          <button onclick="filterTeam('HOME')" class="px-2 py-1 bg-slate-800 rounded font-medium text-slate-400">Local</button>
          <button onclick="filterTeam('AWAY')" class="px-2 py-1 bg-slate-800 rounded font-medium text-slate-400">Visitante</button>
        </div>
      </div>

      <div id="playersList" class="space-y-3"></div>
    </section>

  </main>

  <script>
    // IDs de Ligas Prioritarias en API-Football (Europa + COL, ARG, BRA, Libertadores, Sudamericana)
    const PRIORITY_LEAGUE_IDS = [
      2,   // UEFA Champions League
      3,   // UEFA Europa League
      39,  // Premier League (Inglaterra)
      140, // La Liga (España)
      135, // Serie A (Italia)
      78,  // Bundesliga (Alemania)
      61,  // Ligue 1 (Francia)
      239, // Liga BetPlay (Colombia)
      13,  // Copa Libertadores
      11,  // Copa Sudamericana
      71,  // Brasileirão Serie A (Brasil)
      128  // Liga Profesional (Argentina)
    ];

    let rawLiveFixtures = [];
    let currentPlayers = [];
    let currentFilter = 'ALL';

    function poisson(k, lambda) {
      return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }
    function factorial(n) {
      return (n <= 1) ? 1 : n * factorial(n - 1);
    }
    function probAtLeast(k, lambda) {
      let sum = 0;
      for (let i = 0; i < k; i++) sum += poisson(i, lambda);
      return 1 - sum;
    }

    async function fetchLiveMatches() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        alert("Pega tu API Key antes de sincronizar.");
        return;
      }

      const statusEl = document.getElementById('matchStatus');
      statusEl.textContent = "Cargando...";

      try {
        const today = new Date().toISOString().split('T')[0];
        const res = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
          method: "GET",
          headers: { "x-apisports-key": apiKey }
        });
        const data = await res.json();

        if (data.errors && Object.keys(data.errors).length > 0) {
          alert("Error de API: " + JSON.stringify(data.errors));
          statusEl.textContent = "Error";
          return;
        }

        rawLiveFixtures = data.response || [];
        const select = document.getElementById('matchSelect');
        select.innerHTML = '';

        if (rawLiveFixtures.length === 0) {
          select.innerHTML = '<option value="">No hay partidos programados para hoy</option>';
          statusEl.textContent = "Sin partidos";
          return;
        }

        // Separar y priorizar partidos
        const priorityMatches = [];
        const otherMatches = [];

        rawLiveFixtures.forEach(item => {
          if (PRIORITY_LEAGUE_IDS.includes(item.league.id)) {
            priorityMatches.push(item);
          } else {
            otherMatches.push(item);
          }
        });

        // Poblar el selector colocando primero las ligas priorizadas
        if (priorityMatches.length > 0) {
          const optGroupTop = document.createElement('optgroup');
          optGroupTop.label = "⭐ LIGAS TOP Y SUDAMÉRICA";
          priorityMatches.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.fixture.id;
            opt.textContent = `[${item.league.name}] ${item.teams.home.name} vs ${item.teams.away.name} (${item.fixture.status.short})`;
            optGroupTop.appendChild(opt);
          });
          select.appendChild(optGroupTop);
        }

        if (otherMatches.length > 0) {
          const optGroupOther = document.createElement('optgroup');
          optGroupOther.label = "🌐 Otras Ligas";
          otherMatches.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.fixture.id;
            opt.textContent = `[${item.league.name}] ${item.teams.home.name} vs ${item.teams.away.name} (${item.fixture.status.short})`;
            optGroupOther.appendChild(opt);
          });
          select.appendChild(optGroupOther);
        }

        statusEl.textContent = `${priorityMatches.length} Top / ${rawLiveFixtures.length} Total`;
        analyzeSelectedFixture();

      } catch (e) {
        alert("Error al conectar con API-Sports.");
        statusEl.textContent = "Error de Red";
      }
    }

    async function analyzeSelectedFixture() {
      const fixtureId = document.getElementById('matchSelect').value;
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!fixtureId || !apiKey) return;

      const res = await fetch(`https://v3.football.api-sports.io/fixtures/lineups?fixture=${fixtureId}`, {
        method: "GET",
        headers: { "x-apisports-key": apiKey }
      });
      const data = await res.json();

      currentPlayers = [];

      if (data.response && data.response.length > 0) {
        data.response.forEach((teamData, teamIndex) => {
          const isHome = teamIndex === 0;
          const startX1 = teamData.startXI || [];

          startX1.forEach(p => {
            const playerObj = p.player;
            const sot90 = 1.2;
            const factor = 85 / 90;

            currentPlayers.push({
              name: playerObj.name,
              pos: playerObj.pos || 'JUG',
              team: isHome ? 'HOME' : 'AWAY',
              teamName: teamData.team.name,
              probSOT05: probAtLeast(1, sot90 * factor),
              probSOT15: probAtLeast(2, sot90 * factor),
              probGoal: probAtLeast(1, 0.35 * factor),
              probAst: probAtLeast(1, 0.20 * factor),
              probFouls15: probAtLeast(2, 1.2 * factor),
              probCard: probAtLeast(1, 0.15 * factor)
            });
          });
        });
      }

      renderDashboard();
    }

    function filterTeam(f) {
      currentFilter = f;
      renderDashboard();
    }

    function renderDashboard() {
      const topDiv = document.getElementById('topPicks');
      const listDiv = document.getElementById('playersList');
      topDiv.innerHTML = '';
      listDiv.innerHTML = '';

      if (currentPlayers.length === 0) {
        listDiv.innerHTML = '<p class="text-xs text-slate-500 italic">Alineaciones aún no confirmadas para este partido.</p>';
        return;
      }

      const topPicks = currentPlayers.filter(p => p.probSOT15 >= 0.50).sort((a,b) => b.probSOT15 - a.probSOT15);

      topPicks.slice(0, 3).forEach(p => {
        topDiv.innerHTML += `
          <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-lg p-3 flex justify-between items-center">
            <div>
              <p class="font-bold text-sm text-white">${p.name}</p>
              <p class="text-[10px] text-emerald-400">${p.teamName} — +1.5 Remates a Puerta</p>
            </div>
            <div class="text-right">
              <span class="text-base font-bold text-emerald-400">${(p.probSOT15 * 100).toFixed(1)}%</span>
            </div>
          </div>
        `;
      });

      const filtered = currentPlayers.filter(p => currentFilter === 'ALL' ? true : p.team === currentFilter);

      filtered.forEach(p => {
        listDiv.innerHTML += `
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
            <div class="flex justify-between items-start border-b border-slate-700 pb-2">
              <div>
                <h3 class="font-bold text-sm text-white">${p.name} <span class="text-xs text-slate-400">(${p.pos})</span></h3>
                <p class="text-[10px] text-slate-400">${p.teamName}</p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+0.5)</p>
                <p class="font-bold text-slate-200">${(p.probSOT05 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+1.5)</p>
                <p class="font-bold text-emerald-400">${(p.probSOT15 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Anota Gol</p>
                <p class="font-bold text-slate-200">${(p.probGoal * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Asistencia</p>
                <p class="font-bold text-slate-200">${(p.probAst * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Faltas (+1.5)</p>
                <p class="font-bold text-slate-200">${(p.probFouls15 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Tarjeta</p>
                <p class="font-bold text-amber-400">${(p.probCard * 100).toFixed(1)}%</p>
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
