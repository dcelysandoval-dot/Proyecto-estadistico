<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatsValue Pro + Cuotas Betplay & Rushbet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-20 shadow-lg">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">⚽ StatsValue + Odds Pro</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">Análisis + Betplay & Rushbet</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Selección de Partido Automatizada -->
    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-300">Seleccionar Partido:</label>
        <span id="matchStatus" class="text-[10px] text-emerald-400 font-semibold">Listo</span>
      </div>

      <select id="matchSelect" onchange="analyzeSelectedFixture()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
        <option value="">Cargando partidos...</option>
      </select>

      <button onclick="fetchLiveMatches()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-2 rounded-lg text-xs font-bold transition-all">
        Actualizar Lista de Partidos
      </button>
    </section>

    <!-- Top Valor Esperado / Apuestas Clave -->
    <section class="space-y-3">
      <h2 class="text-base font-bold text-emerald-400 flex items-center gap-2">
        <span>🚀</span> TOP Sugerencias de Apuesta (+EV)
      </h2>
      <div id="topPicks" class="space-y-2">
        <p class="text-xs text-slate-500 italic">Selecciona un partido para ver las mejores sugerencias...</p>
      </div>
    </section>

    <!-- Plantilla Completa de Jugadores con Métricas + Comparador -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>👥</span> Análisis de Jugadores y Cuotas
        </h2>
        <div class="flex gap-1 text-xs">
          <button onclick="filterTeam('ALL')" class="px-2 py-1 bg-slate-700 rounded font-medium text-slate-300">Todos</button>
          <button onclick="filterTeam('HOME')" class="px-2 py-1 bg-slate-800 rounded font-medium text-slate-400">Local</button>
          <button onclick="filterTeam('AWAY')" class="px-2 py-1 bg-slate-800 rounded font-medium text-slate-400">Visitante</button>
        </div>
      </div>

      <div id="playersList" class="space-y-3"></div>
    </section>

  </main>

  <script>
    const BACKEND_URL = "https://stats-backend-jpd3.onrender.com";
    const PRIORITY_LEAGUE_IDS = [2, 3, 39, 140, 135, 78, 61, 239, 13, 11, 71, 128];

    let rawLiveFixtures = [];
    let currentPlayers = [];
    let currentFilter = 'ALL';

    document.addEventListener("DOMContentLoaded", () => {
      fetchLiveMatches();
    });

    async function fetchLiveMatches() {
      const statusEl = document.getElementById('matchStatus');
      statusEl.textContent = "Cargando...";

      try {
        // Cálculo preciso de la fecha local (evita desfases por UTC)
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const today = `${year}-${month}-${day}`;

        const res = await fetch(`${BACKEND_URL}/matches?date=${today}`);
        const data = await res.json();

        if (data.error) {
          statusEl.textContent = "Error servidor";
          alert("Error desde el servidor: " + data.error);
          return;
        }

        rawLiveFixtures = data.response || [];
        const select = document.getElementById('matchSelect');
        select.innerHTML = '';

        if (rawLiveFixtures.length === 0) {
          select.innerHTML = '<option value="">No hay partidos programados hoy</option>';
          statusEl.textContent = "Sin partidos";
          return;
        }

        const priorityMatches = [];
        const otherMatches = [];

        rawLiveFixtures.forEach(item => {
          if (PRIORITY_LEAGUE_IDS.includes(item.league.id)) {
            priorityMatches.push(item);
          } else {
            otherMatches.push(item);
          }
        });

        if (priorityMatches.length > 0) {
          const optGroupTop = document.createElement('optgroup');
          optGroupTop.label = "⭐ LIGAS TOP Y SUDAMÉRICA";
          priorityMatches.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.fixture.id;
            opt.textContent = `[${item.league.name}] ${item.teams.home.name} vs ${item.teams.away.name}`;
            optGroupTop.appendChild(opt);
          });
          select.appendChild(optGroupTop);
        }

        if (otherMatches.length > 0) {
          const optGroupOther = document.createElement('optgroup');
          optGroupOther.label = "🌐 Otras Ligas";
          otherMatches.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.fixture.id;
            opt.textContent = `[${item.league.name}] ${item.teams.home.name} vs ${item.teams.away.name}`;
            optGroupOther.appendChild(opt);
          });
          select.appendChild(optGroupOther);
        }

        statusEl.textContent = `${priorityMatches.length} Top / ${rawLiveFixtures.length} Total`;
        analyzeSelectedFixture();

      } catch (e) {
        statusEl.textContent = "Error Backend";
      }
    }

    async function analyzeSelectedFixture() {
      const fixtureId = document.getElementById('matchSelect').value;
      const statusEl = document.getElementById('matchStatus');

      if (!fixtureId) return;

      statusEl.textContent = "Calculando...";

      try {
        const response = await fetch(`${BACKEND_URL}/analyze-fixture?fixture=${fixtureId}`);
        
        if (!response.ok) {
          throw new Error("Error en la petición a Render");
        }

        const data = await response.json();
        currentPlayers = data.players || [];
        statusEl.textContent = "Listo";
        renderDashboard();

      } catch (e) {
        alert("Error de conexión con el backend");
        statusEl.textContent = "Error Backend";
      }
    }

    function filterTeam(f) {
      currentFilter = f;
      renderDashboard();
    }

    function renderDashboard() {
      const topDiv = document.getElementById('topPicks');
      const listDiv = document.getElementById('playersList');
      topDiv.innerHTML = '';
      listDiv.innerHTML = '';

      if (currentPlayers.length === 0) {
        listDiv.innerHTML = '<p class="text-xs text-slate-500 italic">Alineaciones no disponibles aún para este partido.</p>';
        return;
      }

      const topEV = [...currentPlayers].sort((a,b) => b.maxEV - a.maxEV);

      topEV.slice(0, 3).forEach(p => {
        topDiv.innerHTML += `
          <div class="bg-emerald-950/50 border border-emerald-500/40 rounded-lg p-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <p class="font-bold text-sm text-white">${p.name} <span class="text-xs text-slate-400">(${p.pos})</span></p>
                <span class="text-[9px] bg-emerald-500 text-slate-950 px-1.5 py-0.5 rounded font-bold">+EV ${p.maxEV.toFixed(1)}%</span>
              </div>
              <p class="text-[10px] text-emerald-400">${p.teamName} — <b>${p.suggestedMarket}</b></p>
              <p class="text-[10px] text-slate-300">Apostar en: <b class="text-amber-400">${p.bestBookie} (Cuota ${p.bestOdd})</b></p>
            </div>
            <div class="text-right">
              <span class="text-[10px] text-slate-400">Prob. Real</span>
              <p class="text-base font-bold text-emerald-400">${(p.probSOT05 * 100).toFixed(1)}%</p>
            </div>
          </div>
        `;
      });

      const filtered = currentPlayers.filter(p => currentFilter === 'ALL' ? true : p.team === currentFilter);

      filtered.forEach(p => {
        listDiv.innerHTML += `
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
            <div class="flex justify-between items-start border-b border-slate-700 pb-2">
              <div>
                <h3 class="font-bold text-sm text-white">${p.name} <span class="text-xs text-slate-400">(${p.pos})</span></h3>
                <p class="text-[10px] text-slate-400">${p.teamName}</p>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-slate-400 block">Sugerencia:</span>
                <span class="text-xs font-bold text-amber-400">${p.suggestedMarket}</span>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+0.5)</p>
                <p class="font-bold ${p.probSOT05 >= 0.60 ? 'text-emerald-400' : 'text-slate-200'}">${(p.probSOT05 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Rem. Puerta (+1.5)</p>
                <p class="font-bold ${p.probSOT15 >= 0.40 ? 'text-emerald-400' : 'text-slate-200'}">${(p.probSOT15 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Anota Gol</p>
                <p class="font-bold text-slate-200">${(p.probGoal * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Asistencia</p>
                <p class="font-bold text-slate-200">${(p.probAst * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Faltas (+1.5)</p>
                <p class="font-bold text-slate-200">${(p.probFouls15 * 100).toFixed(1)}%</p>
              </div>
              <div class="bg-slate-900/60 p-2 rounded">
                <p class="text-[9px] text-slate-400">Tarjeta</p>
                <p class="font-bold text-amber-400">${(p.probCard * 100).toFixed(1)}%</p>
              </div>
            </div>

            <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
              <div>
                <span class="text-[10px] text-slate-400 block">Mejor Opción de Apuesta:</span>
                <span class="font-bold text-white text-xs">${p.suggestedMarket}</span>
              </div>
              <div class="flex gap-2 text-right">
                <div class="px-2 py-1 bg-slate-800 rounded border border-blue-500/30">
                  <p class="text-[9px] text-blue-400 font-bold">Betplay</p>
                  <p class="font-bold text-white text-xs">${p.betplayOdd}</p>
                </div>
                <div class="px-2 py-1 bg-slate-800 rounded border border-orange-500/30">
                  <p class="text-[9px] text-orange-400 font-bold">Rushbet</p>
                  <p class="font-bold text-white text-xs">${p.rushbetOdd}</p>
                </div>
              </div>
            </div>

          </div>
        `;
      });
    }
  </script>
</body>
</html>
