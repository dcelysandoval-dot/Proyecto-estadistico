<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Apuestas de Jugadores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">⚽ StatsValue V1</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">Modelo Poisson Pro</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Formulario de Entrada -->
    <section class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        <span>📋</span> Datos del Jugador y Partido
      </h2>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 font-medium">Nombre del Jugador</label>
          <input id="pName" type="text" value="Mohamed Salah" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 font-medium">Minutos Proyectados</label>
            <input id="pMins" type="number" value="85" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-medium">Dificultad Rival (0.8 - 1.2)</label>
            <input id="pDiff" type="number" step="0.1" value="1.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="1.0 = Neutro">
          </div>
        </div>

        <!-- Promedios por 90 min -->
        <div class="border-t border-slate-700 pt-3">
          <p class="text-xs font-semibold text-slate-300 mb-2">Promedios Históricos (por 90 min):</p>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] text-slate-400">Remates Tot.</label>
              <input id="pShots" type="number" step="0.1" value="3.4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">A Puerta</label>
              <input id="pSOT" type="number" step="0.1" value="1.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">Goles (xG)</label>
              <input id="pGoals" type="number" step="0.01" value="0.55" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">Asist. (xA)</label>
              <input id="pAst" type="number" step="0.01" value="0.30" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">Faltas Com.</label>
              <input id="pFouls" type="number" step="0.1" value="0.9" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>
            <div>
              <label class="text-[10px] text-slate-400">Tarjetas/90</label>
              <input id="pCards" type="number" step="0.01" value="0.12" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>
          </div>
        </div>

        <!-- Selección de Línea a Analizar -->
        <div class="border-t border-slate-700 pt-3 grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 font-medium">Mercado Evaluar</label>
            <select id="mSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="sot">Remates a Puerta</option>
              <option value="shots">Remates Totales</option>
              <option value="goals">Gol en cualquier momento</option>
              <option value="ast">Asistencia</option>
              <option value="fouls">Faltas Cometidas</option>
              <option value="cards">Recibirá Tarjeta</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 font-medium">Línea y Cuota</label>
            <div class="flex gap-1">
              <input id="mLine" type="number" step="0.5" value="1.5" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white" placeholder="Línea (+1.5)">
              <input id="mOdds" type="number" step="0.01" value="1.70" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white" placeholder="Cuota">
            </div>
          </div>
        </div>

        <button onclick="calculateAll()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg shadow-md transition-all text-sm mt-2">
          🔥 Analizar Probabilidades y Valor
        </button>
      </div>
    </section>

    <!-- Resultados Estadísticos -->
    <section id="results" class="space-y-4">
      <!-- Se llena dinámicamente con JS -->
    </section>

  </main>

  <script>
    // Función matemática: Distribución de Poisson P(K)
    function poisson(k, lambda) {
      return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }

    function factorial(n) {
      if (n === 0 || n === 1) return 1;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    // Calcular P(X >= K)
    function probAtLeast(k, lambda) {
      let sumLess = 0;
      for (let i = 0; i < k; i++) {
        sumLess += poisson(i, lambda);
      }
      return 1 - sumLess;
    }

    function calculateAll() {
      const name = document.getElementById('pName').value;
      const mins = parseFloat(document.getElementById('pMins').value);
      const diff = parseFloat(document.getElementById('pDiff').value);
      
      // Ajuste de expectativas según minutos jugados y dificultad del rival
      const factor = (mins / 90) * diff;

      const stats = {
        shots: parseFloat(document.getElementById('pShots').value) * factor,
        sot: parseFloat(document.getElementById('pSOT').value) * factor,
        goals: parseFloat(document.getElementById('pGoals').value) * factor,
        ast: parseFloat(document.getElementById('pAst').value) * factor,
        fouls: parseFloat(document.getElementById('pFouls').value) * factor,
        cards: parseFloat(document.getElementById('pCards').value) * factor,
      };

      const market = document.getElementById('mSelect').value;
      const line = parseFloat(document.getElementById('mLine').value);
      const odds = parseFloat(document.getElementById('mOdds').value);

      // Probabilidad objetivo del mercado seleccionado (Línea +k.5 -> necesitamos > k)
      const targetK = Math.floor(line) + 1;
      const probTarget = probAtLeast(targetK, stats[market]);
      
      const minOddsModel = 1 / probTarget;
      const ev = (probTarget * odds) - 1;
      const evPct = (ev * 100).toFixed(1);

      // Criterio de Kelly Conservador (Fracción 1/4)
      const kelly = Math.max(0, ((probTarget * odds - 1) / (odds - 1)) * 0.25 * 100).toFixed(1);

      // Evaluación del Sistema Conservador de Remates
      let signalColor = 'bg-red-500/10 border-red-500/30 text-red-400';
      let signalBadge = '🔴 SIN VALOR / EV-';
      
      if (ev > 0.05 && probTarget >= 0.60) {
        signalColor = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
        signalBadge = '🟢 ALTA CONFIANZA (>60% Prob & EV+)';
      } else if (ev > 0) {
        signalColor = 'bg-amber-500/10 border-amber-500/30 text-amber-400';
        signalBadge = '🟡 VALOR MODERADO';
      }

      // Renderizar Resultado
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `
        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-sm space-y-4">
          <div class="flex justify-between items-start border-b border-slate-700 pb-3">
            <div>
              <h3 class="font-bold text-lg text-white">${name}</h3>
              <p class="text-xs text-slate-400">Proyección ajustada: ${mins} min | Factor Rival: x${diff}</p>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full border font-bold ${signalColor}">${signalBadge}</span>
          </div>

          <!-- Evaluación del Pick Específico -->
          <div class="bg-slate-900/60 p-3.5 rounded-lg border border-slate-700/50 space-y-2">
            <div class="flex justify-between text-xs font-semibold">
              <span class="text-slate-300">Mercado: ${market.toUpperCase()} (+${line})</span>
              <span class="text-emerald-400">Cuota Encontrada: ${odds.toFixed(2)}</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center pt-2 border-t border-slate-800">
              <div>
                <p class="text-[10px] text-slate-400">Prob. Modelo</p>
                <p class="text-base font-bold text-white">${(probTarget * 100).toFixed(1)}%</p>
              </div>
              <div>
                <p class="text-[10px] text-slate-400">Cuota Mín. (Sin Riesgo)</p>
                <p class="text-base font-bold text-slate-300">${minOddsModel.toFixed(2)}</p>
              </div>
              <div>
                <p class="text-[10px] text-slate-400">Valor Esperado (EV)</p>
                <p class="text-base font-bold ${ev >= 0 ? 'text-emerald-400' : 'text-red-400'}">${evPct}%</p>
              </div>
            </div>
            <div class="text-xs text-slate-400 pt-1 text-right">
              Stake Sugerido (Kelly conservador): <strong class="text-white">${kelly}% de la banca</strong>
            </div>
          </div>

          <!-- Tabla con Matriz Completa del Jugador -->
          <div>
            <h4 class="text-xs font-bold text-slate-300 mb-2">📊 Probabilidades por Evento Individual:</h4>
            <div class="space-y-1.5 text-xs">
              <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded">
                <span class="text-slate-400">Más de 0.5 Remates a Puerta</span>
                <span class="font-semibold text-slate-200">${(probAtLeast(1, stats.sot) * 100).toFixed(1)}%</span>
              </div>
              <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded">
                <span class="text-slate-400">Más de 1.5 Remates a Puerta</span>
                <span class="font-semibold text-slate-200">${(probAtLeast(2, stats.sot) * 100).toFixed(1)}%</span>
              </div>
              <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded">
                <span class="text-slate-400">Anota un Gol (xG)</span>
                <span class="font-semibold text-slate-200">${(probAtLeast(1, stats.goals) * 100).toFixed(1)}%</span>
              </div>
              <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded">
                <span class="text-slate-400">Hace una Asistencia (xA)</span>
                <span class="font-semibold text-slate-200">${(probAtLeast(1, stats.ast) * 100).toFixed(1)}%</span>
              </div>
              <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded">
                <span class="text-slate-400">Más de 1.5 Faltas Cometidas</span>
                <span class="font-semibold text-slate-200">${(probAtLeast(2, stats.fouls) * 100).toFixed(1)}%</span>
              </div>
              <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded">
                <span class="text-slate-400">Recibe una Tarjeta</span>
                <span class="font-semibold text-slate-200">${(probAtLeast(1, stats.cards) * 100).toFixed(1)}%</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Ejecutar una primera vez al cargar
    calculateAll();
  </script>
</body>
  </html>
