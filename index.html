<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fútbol Analytics - Partidos de Hoy</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20 px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .contenedor-partidos {
      display: grid;
      grid-template-columns: repeat (auto-fit, minmax (300 px, 1fr));
      gap: 16 px;
      max-width: 1000 px;
      margin: 20 px auto;
    }

    .tarjeta-partido {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .liga-titulo {
      font-size: 0.85em;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .marcador-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
      font-size: 1.1em;
      font-weight: bold;
    }

    .equipo {
      flex: 1;
    }

    .equipo.visitante {
      text-align: right;
    }

    .resultado {
      background-color: #0f172a;
      padding: 6px 12px;
      border-radius: 4px;
      color: #38bdf8;
      margin: 0 10px;
    }

    .estado-tag {
      display: inline-block;
      font-size: 0.75em;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #334155;
      color: #cbd5e1;
    }

    .cargando {
      text-align: center;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>Fútbol Analytics - En Vivo</h1>
  <div id="lista-partidos" class="contenedor-partidos">
    <p class="cargando">Cargando partidos...</p>
  </div>

  <script>
    // URL de tu API desplegada en Render
    const API_URL = "https://stats-backend-jpd3.onrender.com/api/partidos-hoy";

    async function obtenerPartidos() {
      const contenedor = document.getElementById("lista-partidos");

      try {
        const respuesta = await fetch(API_URL);

        if (!respuesta.ok) {
          throw new Error(`Error en la solicitud: ${respuesta.status}`);
        }

        const datos = await respuesta.json();
        const partidos = datos.matches;

        if (!partidos || partidos.length === 0) {
          contenedor.innerHTML = "<p class='cargando'>No hay partidos programados para el día de hoy.</p>";
          return;
        }

        contenedor.innerHTML = "";

        partidos.forEach(partido => {
          const equipoLocal = partido.homeTeam.name;
          const equipoVisitante = partido.awayTeam.name;
          const competicion = partido.competition.name;
          const estado = partido.status;

          // Extraer goles con respaldo si aún no se ha jugado
          const golesLocal = partido.score.fullTime.home ?? "-";
          const golesVisitante = partido.score.fullTime.away ?? "-";

          const tarjeta = document.createElement("div");
          tarjeta.className = "tarjeta-partido";
          tarjeta.innerHTML = `
            <div class="liga-titulo">${competicion}</div>
            <div class="marcador-container">
              <span class="equipo local">${equipoLocal}</span>
              <span class="resultado">${golesLocal} - ${golesVisitante}</span>
              <span class="equipo visitante">${equipoVisitante}</span>
            </div>
            <span class="estado-tag">Estado: ${estado}</span>
          `;

          contenedor.appendChild(tarjeta);
        });

      } catch (error) {
        console.error("Error consultando el backend:", error);
        contenedor.innerHTML = "<p class='cargando'>Error al cargar la información de partidos.</p>";
      }
    }

    // Cargar datos automáticamente al abrir la página
    document.addEventListener("DOMContentLoaded", obtenerPartidos);
  </script>
</body>
</html>
